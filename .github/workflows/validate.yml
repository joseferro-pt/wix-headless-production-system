name: Validate production protocol
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Scan all tracked toolkit files for site content and credential signatures
        run: node scripts/check-repository-boundary.mjs
      - name: Check toolkit release-governance wiring (not publication)
        run: node scripts/check-release-readiness.mjs --policy
      - name: Check v0.2.0 published release notes and policies (not publication)
        run: node scripts/check-release-readiness.mjs --release --version v0.2.0
      - name: Check v0.2.1 versioned release notes and policies (not publication)
        run: node scripts/check-release-readiness.mjs --release --version v0.2.1
      - name: Check v0.3.0 separate-approval release candidate prerequisites (not publication)
        run: node scripts/check-release-readiness.mjs --release --version v0.3.0
      - name: Test handoff parser and manifest contracts
        run: node --test tests/*.test.mjs
      - name: Python archive and Dependabot YAML contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Sample intake and offline validation
        run: |
          node scripts/intake-wix-handoff.mjs examples/wix-generated-prompt.example.txt /tmp/example-site
          node scripts/validate-manifest.mjs /tmp/example-site/site.manifest.json
      - name: WHPS-003 offline planner and output schema smoke test
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          node scripts/plan-wix-resources.mjs --input examples/resource-plan.synthetic.json > "$scratch/plan.json"
          python3 - "$scratch/plan.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf8'))
          assert p["execution"] == "never"
          assert p["summary"]["reuse"] == 1 and p["summary"]["create"] == 1
          assert p["approval"] == "required-for-every-change"
          PY
          python3 scripts/validate-json-schema.py schemas/resource-plan-output.schema.json < "$scratch/plan.json" | python3 -c 'import json,sys; assert json.load(sys.stdin)["valid"]'
      - name: WHPS-002 offline site bootstrap smoke test
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          trap 'rm -rf "$sandbox"' EXIT
          node scripts/bootstrap-site-workspace.mjs --mode unbound-frontend --output "$sandbox/unbound-site"
          node scripts/validate-manifest.mjs "$sandbox/unbound-site/site.manifest.json"
          test "$(git -C "$sandbox/unbound-site" branch --show-current)" = main
          python3 - "$sandbox/unbound-site/whps.lock.json" "$(git rev-parse HEAD)" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf8'))
          assert p['lockVersion']==2
          assert p['toolkitSource']['commit']==sys.argv[2]
          assert p['generator']['sourceCommit']==sys.argv[2]
          assert p['toolkitSource']['releaseVerification']=='not-performed'
          PY
          python3 scripts/validate-json-schema.py schemas/whps-adoption-lock.schema.json < "$sandbox/unbound-site/whps.lock.json" | python3 -c 'import json,sys; assert json.load(sys.stdin)["valid"]'
          node scripts/bootstrap-site-workspace.mjs --mode wix-handoff --output "$sandbox/wix-site" --handoff examples/wix-generated-prompt.example.txt
          node scripts/validate-manifest.mjs "$sandbox/wix-site/site.manifest.json"
          test "$(git -C "$sandbox/wix-site" branch --show-current)" = main
      - name: WHPS-006 deterministic distribution/adoption smoke test (NO live GitHub or Wix call)
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          node scripts/plan-toolkit-adoption.mjs --input examples/toolkit-adoption.synthetic.json --json > "$scratch/plan.json"
          python3 - "$scratch/plan.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf8'))
          assert p['execution']=='never' and p['siteAction']=='none'
          assert p['status']=='review-required'
          assert p['target']['tag']=='v0.2.1'
          assert p['candidateSiteRecord']['approval']=='pending'
          PY
          python3 scripts/validate-json-schema.py schemas/toolkit-adoption-plan-input.schema.json < examples/toolkit-adoption.synthetic.json | python3 -c 'import json,sys; assert json.load(sys.stdin)["valid"]'
          python3 - "$scratch/plan.json" > "$scratch/adoption.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf8'))
          print(json.dumps(p['candidateSiteRecord']))
          PY
          python3 scripts/validate-json-schema.py schemas/site-toolkit-adoption.schema.json < "$scratch/adoption.json" | python3 -c 'import json,sys; assert json.load(sys.stdin)["valid"]'
      - name: Install audited Astro reference dependency lock without updates
        run: npm --prefix frontend/astro-primitives ci --no-audit --no-fund
      - name: TypeScript and Astro diagnostics on synthetic reference
        run: npm --prefix frontend/astro-primitives run check
      - name: Compile synthetic Astro/React/Tailwind reference (NO Wix SDK, deploy or project auth)
        run: npm --prefix frontend/astro-primitives run build
      - name: Install Chromium for synthetic browser QA only
        run: npm --prefix frontend/astro-primitives exec -- playwright install --with-deps chromium
      - name: Exercise Astro hydration, keyboard, responsive layout and axe accessibility
        run: npm --prefix frontend/astro-primitives run test:browser
