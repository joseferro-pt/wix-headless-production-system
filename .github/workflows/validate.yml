name: Validate production protocol
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JSON Schema validator dependency
        run: python -m pip install -r requirements.txt
      - name: Scan all tracked toolkit files for site identifiers and credentials
        run: node scripts/check-repository-boundary.mjs
      - name: Test handoff parser and manifest contracts
        run: node --test tests/*.test.mjs
      - name: Check toolkit and website separation
        run: node --test tests/system-boundary.test.mjs
      - name: Python archive contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Sample intake and offline validation
        run: |
          node scripts/intake-wix-handoff.mjs examples/wix-generated-prompt.example.txt /tmp/example-site
          node scripts/validate-manifest.mjs /tmp/example-site/site.manifest.json
