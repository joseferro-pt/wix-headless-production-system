# WHPS-only Dependabot version updates. Never scans client websites.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      workflow-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/frontend/astro-primitives"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
# Major version proposals are separate and require explicit compatibility review.
